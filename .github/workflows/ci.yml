name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint（Biome・型検査・文書の点検・terraform fmt）と Unit テスト。
  # Docker を使う E2E（test:e2e:docker / test:e2e:full）、wrangler dev を使う E2E、
  # terraform init が要る test:infra は CI では流さない（手元の mise run test で流す）。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: pnpm のストアの場所を取り出す
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - run: mise run install
      - run: mise run lint
      - run: mise run test:unit

  # 本物の秘密の検出（gitleaks）。下流の private リポジトリに取り込まれても動く（条件を付けない）。
  # 全履歴を調べるので fetch-depth: 0。
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: mise run scan:gitleaks

  # 公開のための点検（account id・workers.dev・リポジトリ名・絶対パス・Claude-Session）。
  # upstream を公開するためのもので、下流は account id などを持つのが正しいので upstream だけで動かす。
  # gitleaks も含めた手元の点検は mise run scan:secrets。
  patterns:
    if: github.repository == 'youyo/rovo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: mise run scan:secrets
