<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -10 110 110" width="256" height="256" role="img" aria-label="Rovo"><title>Rovo</title><defs><linearGradient id="y" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54a"/><stop offset=".55" stop-color="#fbb52c"/><stop offset="1" stop-color="#f08c16"/></linearGradient><linearGradient id="o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7a41f"/><stop offset="1" stop-color="#d9700e"/></linearGradient><linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6c7682"/><stop offset=".45" stop-color="#c4ccd4"/><stop offset="1" stop-color="#5a636e"/></linearGradient><radialGradient id="lens" cx=".4" cy=".36" r=".75"><stop offset="0" stop-color="#e9fff6"/><stop offset=".22" stop-color="#9ef0c9"/><stop offset=".6" stop-color="#2fae98"/><stop offset="1" stop-color="#11465a"/></radialGradient><radialGradient id="ring" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#d9dfe6"/><stop offset=".6" stop-color="#7d8894"/><stop offset="1" stop-color="#3f4852"/></radialGradient><symbol id="r" viewBox="-5 -10 110 110">
    <g stroke="#0b0d16" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <!-- 煙 -->
      <g fill="#b9c3cd" stroke-width="2.5"><circle cx="86" cy="16" r="5.5"/><circle cx="95" cy="9" r="7.5"/><circle cx="91" cy="15" r="5"/></g>
      <circle cx="93" cy="7" r="2.4" fill="#e6ebf0" stroke="none"/>
      <!-- 煙突 -->
      <path d="M78 44 H86 V26" fill="none" stroke-width="9"/>
      <path d="M78 44 H86 V26" fill="none" stroke="url(#pipe)" stroke-width="4.5"/>
      <rect x="81.5" y="20" width="9" height="6" rx="1.5" fill="url(#pipe)" stroke-width="2.5"/>
      <!-- 右の耳 -->
      <rect x="74" y="40" width="12" height="18" rx="4" fill="url(#o)" stroke-width="3"/>
      <!-- アンテナ -->
      <path d="M50 15 V-2" stroke-width="6"/><path d="M50 15 V-2" stroke="#f7a41f" stroke-width="2.4"/>
      <circle cx="50" cy="-4" r="4.5" fill="#fbb52c" stroke-width="2.5"/>
      <!-- R -->
      <path d="M20 92 V46 Q20 14 50 14 Q80 14 80 46 Q80 64 64 70 L82 92 H60 L46 75 H40 V92 Z" fill="url(#y)"/>
    </g>
    <!-- 陰（足と下側） -->
    <path d="M64 70 L82 92 H60 L46 75 Z" fill="#e2780f" opacity=".55"/>
    <path d="M20 70 H40 V92 H20 Z" fill="#e2780f" opacity=".35"/>
    <!-- 帯 -->
    <path d="M22 47 H78" stroke="#0b0d16" stroke-width="2.6"/>
    <!-- 目 -->
    <circle cx="50" cy="45" r="14" fill="url(#ring)" stroke="#0b0d16" stroke-width="3.5"/>
    <circle cx="50" cy="45" r="9.5" fill="url(#lens)" stroke="#0b0d16" stroke-width="2"/>
    <ellipse cx="46.5" cy="41.5" rx="3.6" ry="2.6" fill="#fff" transform="rotate(-30 46.5 41.5)"/>
    <circle cx="54" cy="49" r="1.3" fill="#fff" opacity=".7"/>
    <!-- 光 -->
    <path d="M26 40 Q27 24 40 19" fill="none" stroke="#fff3c2" stroke-width="3.2" stroke-linecap="round" opacity=".85"/>
    <path d="M24 56 V84" stroke="#fff3c2" stroke-width="2.4" stroke-linecap="round" opacity=".45"/>
  </symbol><symbol id="rS" viewBox="-5 -10 110 110">
    <g stroke="#0b0d16" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="92" cy="12" r="7" fill="#b9c3cd" stroke-width="3"/>
      <path d="M80 44 H87 V24" fill="none" stroke-width="11"/>
      <path d="M80 44 H87 V24" fill="none" stroke="#a3adb7" stroke-width="5"/>
      <path d="M50 15 V-2" stroke-width="7"/><path d="M50 15 V-2" stroke="#f7a41f" stroke-width="3"/>
      <circle cx="50" cy="-4" r="5" fill="#fbb52c" stroke-width="3"/>
      <path d="M18 94 V46 Q18 13 50 13 Q82 13 82 46 Q82 64 66 70 L85 94 H60 L46 76 H41 V94 Z" fill="#fbb52c"/>
      <circle cx="50" cy="45" r="15" fill="#8d97a2" stroke-width="4"/>
    </g>
    <circle cx="50" cy="45" r="10" fill="#3fc9a8"/>
    <circle cx="46" cy="41" r="3.4" fill="#fff"/>
  </symbol><symbol id="gear" viewBox="-20 -20 40 40">
    <g stroke="#0b0d16" stroke-width="2.5" stroke-linejoin="round" fill="#f3a01f">
      <path d="M-3.5 -17 H3.5 L4.5 -11.5 L8.7 -9.7 L13.2 -13 L18 -8.2 L14.7 -3.7 L16.5 0.5 L17 3.5 V-3.5 Z" opacity="0"/>
      <g id="teeth">
        <rect x="-4" y="-18" width="8" height="8" rx="1.5"/>
        <rect x="-4" y="-18" width="8" height="8" rx="1.5" transform="rotate(45)"/>
        <rect x="-4" y="-18" width="8" height="8" rx="1.5" transform="rotate(90)"/>
        <rect x="-4" y="-18" width="8" height="8" rx="1.5" transform="rotate(135)"/>
        <rect x="-4" y="-18" width="8" height="8" rx="1.5" transform="rotate(180)"/>
        <rect x="-4" y="-18" width="8" height="8" rx="1.5" transform="rotate(225)"/>
        <rect x="-4" y="-18" width="8" height="8" rx="1.5" transform="rotate(270)"/>
        <rect x="-4" y="-18" width="8" height="8" rx="1.5" transform="rotate(315)"/>
      </g>
      <circle r="12.5"/>
    </g>
    <circle r="12.5" fill="#f3a01f"/>
    <circle r="5" fill="#0a0d18" stroke="#0b0d16" stroke-width="2"/>
  </symbol></defs><use href="#r"/></svg>
