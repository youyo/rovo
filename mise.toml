[tools]
node = "24.21.0"
pnpm = "12.14.0"

[env]
# wrangler の対話・テレメトリを止める（CI=1 は pnpm install を frozen-lockfile 扱いにもする）
WRANGLER_SEND_METRICS = "false"
CI = "1"

[tasks.install]
description = "依存パッケージをインストール"
run = "pnpm install --frozen-lockfile"

[tasks."typegen:gateway"]
description = "gateway: wrangler types で Env 型を生成"
dir = "apps/gateway"
run = "pnpm exec wrangler types --env-interface Env --strict-vars=false"

[tasks."typegen:agent"]
description = "agent: wrangler types で Env 型を生成"
dir = "apps/agent"
run = "pnpm exec wrangler types --env-interface Env --strict-vars=false"

[tasks."typegen:web"]
description = "web: wrangler types で Env 型を生成"
dir = "apps/web"
run = "pnpm exec wrangler types --env-interface Env --strict-vars=false"

[tasks.typegen]
description = "全アプリの Env 型を生成（wrangler.jsonc を変えたら実行）"
depends = ["typegen:gateway", "typegen:agent", "typegen:web"]

[tasks."test:unit:gateway"]
description = "gateway の Unit テスト（vitest + workerd）"
dir = "apps/gateway"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks."test:unit:agent"]
description = "agent の Unit テスト（vitest + workerd。コンテナは使えないので SandboxPort は fake）"
dir = "apps/agent"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks."test:unit:web"]
description = "web の Unit テスト（vitest + workerd。WebSearchSource / fetch / AI.run は fake。実アカウントは呼ばない）"
dir = "apps/web"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks."test:unit"]
description = "Unit テスト（gateway + agent + web）"
depends = ["test:unit:gateway", "test:unit:agent", "test:unit:web"]

[tasks."test:e2e:gateway"]
description = "gateway の E2E（wrangler dev で実 Worker と偽 GitHub を起動し、MCP SDK Client から通しで検証）"
dir = "apps/gateway"
run = "pnpm exec vitest run --config vitest.e2e.config.ts"

[tasks."test:e2e:docker"]
description = "agent の E2E（Docker 必須）。wrangler dev で実コンテナを起動し、偽サーバーで外向き通信の許可・拒否と Gateway→Agent の DO RPC を検証"
dir = "apps/agent"
run = "pnpm exec vitest run --config vitest.e2e.config.ts"
# 負荷によるタイムアウトを避けるため、Unit などの他のテストと同時には走らせない
wait_for = ["test:unit:gateway", "test:unit:agent", "test:unit:web", "test:fake-github", "test:e2e:gateway"]

[tasks."test:e2e:full"]
description = "Gateway(MCP) → AgentDO → SandboxDO（実コンテナ）の通しの E2E（Docker 必須）。Phase 3 のゴール（Draft PR・push・PR 本文の更新・トークンの失効）の検証。test:e2e:docker と Docker コンテナの片付けが干渉しないよう、同時には走らせない"
dir = "apps/gateway"
run = "pnpm exec vitest run --config vitest.e2e-full.config.ts"
wait_for = ["test:e2e:docker"]

[tasks."test:e2e"]
description = "E2E（gateway + agent + 通し。agent と通しは Docker 必須）"
depends = ["test:e2e:gateway", "test:e2e:docker", "test:e2e:full"]

[tasks."test:e2e:net"]
description = "agent の E2E の実ネットワーク版（Docker 必須。実 npm への GET・許可外ホストの拒否・github.com への認証なし clone が 401 で落ちること。CI の test には含めない）"
dir = "apps/agent"
run = "pnpm exec vitest run --config vitest.e2e-net.config.ts"

[tasks.test]
description = "Unit + 偽 GitHub + E2E（Docker 必須。実ネットワーク版 test:e2e:net は含まない）"
depends = ["test:unit", "test:fake-github", "test:e2e"]

[tasks."typecheck:gateway"]
description = "gateway の型検査"
dir = "apps/gateway"
run = "pnpm exec tsc -p tsconfig.json && pnpm exec tsc -p test/e2e/tsconfig.json && pnpm exec tsc -p test/full/tsconfig.json && pnpm exec tsc -p test/fake-github/tsconfig.json"

[tasks."typecheck:agent"]
description = "agent の型検査"
dir = "apps/agent"
run = "pnpm exec tsc -p tsconfig.json && pnpm exec tsc -p test/e2e/tsconfig.json"

[tasks."typecheck:web"]
description = "web の型検査"
dir = "apps/web"
run = "pnpm exec tsc -p tsconfig.json"

[tasks.typecheck]
description = "TypeScript の型検査（全アプリ）"
depends = ["typecheck:gateway", "typecheck:agent", "typecheck:web"]

[tasks."lint:biome"]
description = "Biome による lint / format チェック"
run = "pnpm exec biome check ."

[tasks.lint]
description = "lint + 型検査"
depends = ["lint:biome", "typecheck"]

[tasks.fmt]
description = "Biome で整形"
run = "pnpm exec biome check --write ."

[tasks.build]
description = "Worker をバンドル（デプロイはしない）"
dir = "apps/gateway"
run = "pnpm exec wrangler deploy --dry-run --outdir dist"

[tasks.dev]
description = "wrangler dev でローカル起動（apps/gateway/.dev.vars を読む。.dev.vars.example 参照）。gateway 単体"
dir = "apps/gateway"
run = "pnpm exec wrangler dev"

[tasks."dev:all"]
description = "gateway と agent を同時にローカル起動（Docker 必須）。script_name 付きバインディングは両方を同時に起動しないと本番の DO を参照する"
run = "node apps/gateway/node_modules/wrangler/bin/wrangler.js dev -c apps/gateway/wrangler.jsonc -c apps/agent/wrangler.jsonc"

[tasks."test:fake-github"]
description = "偽 GitHub サーバーと GitHub クライアントの結合テスト（Node）"
dir = "apps/gateway"
run = "pnpm exec vitest run --config vitest.fake-github.config.ts"
