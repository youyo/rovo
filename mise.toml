[tools]
gitleaks = "8.30.1"
node = "24.21.0"
pnpm = "12.14.0"
terraform = "1.15.8"

[env]
# wrangler のテレメトリを止める
# CI=1 はここに置かない。mise の [env] は対話シェル全体に export されるため、
# Claude Code などの CLI が色を無効化する（supports-color は CI があると色レベル 0 を返す）。
# pnpm install の frozen-lockfile は install タスクで明示している
WRANGLER_SEND_METRICS = "false"

[tasks.install]
description = "依存パッケージをインストール"
run = "pnpm install --frozen-lockfile"

[tasks."install:update-lock"]
description = "依存を追加・変更したあとに pnpm-lock.yaml を更新する（通常の install は --frozen-lockfile）"
run = "pnpm install --no-frozen-lockfile"

[tasks."typegen:gateway"]
description = "gateway: wrangler types で Env 型を生成"
dir = "apps/gateway"
run = "pnpm exec wrangler types --env-interface Env --strict-vars=false"

[tasks."typegen:agent"]
description = "agent: wrangler types で Env 型を生成"
dir = "apps/agent"
run = "pnpm exec wrangler types --env-interface Env --strict-vars=false"

[tasks."typegen:web"]
description = "web: wrangler types で Env 型を生成"
dir = "apps/web"
run = "pnpm exec wrangler types --env-interface Env --strict-vars=false"

[tasks.typegen]
description = "全アプリの Env 型を生成（wrangler.jsonc を変えたら実行）"
depends = ["typegen:gateway", "typegen:agent", "typegen:web"]

[tasks."test:unit:audit"]
description = "packages/audit の Unit テスト（vitest。純粋関数だけなので workerd は使わない）"
dir = "packages/audit"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks."test:unit:models"]
description = "packages/models の Unit テスト（許可リスト・カタログからの単価・費用計算。vitest。workerd は使わない）"
dir = "packages/models"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks."test:unit:gateway"]
description = "gateway の Unit テスト（vitest + workerd）"
dir = "apps/gateway"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks."test:unit:agent"]
description = "agent の Unit テスト（vitest + workerd。コンテナは使えないので SandboxPort は fake）"
dir = "apps/agent"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks."test:unit:web"]
description = "web の Unit テスト（vitest + workerd。WebSearchSource / fetch / AI.run は fake。実アカウントは呼ばない）"
dir = "apps/web"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks."test:deploy"]
description = "デプロイスクリプト（scripts/deploy.sh）の自己確認。pnpm・openssl・terraform を偽物に差し替えるので wrangler も Cloudflare も呼ばない。ROVO_DEPLOY_DIR が未設定・設定ファイルが無いときに失敗し、wrangler を呼ばないこと、secrets が無いものだけを標準入力で入れることを確かめる"
run = "bash scripts/test-deploy.sh"

[tasks."test:deploy:config"]
description = "deploy:config（設定の生成器 scripts/deploy-config*.mjs）のテスト。本番相当の架空の入力から手書き相当の wrangler 設定が出ること、--check、sensitive の出力を読まないことを固定する。偽の terraform を使い、実アカウントには触れない"
run = "node --test scripts/deploy-config.test.mjs"

[tasks."test:setup"]
description = "setup（scripts/setup.sh）の自己確認。terraform・pnpm・openssl・docker・mise をすべて偽物に差し替え、PATH から本物を外す。前提の欠け・順序・apply の失敗・GitHub App 未設定・秘密の値が出ないことを確かめる"
run = "bash scripts/test-setup.sh"

[tasks."test:github-app"]
description = "github-app（GitHub App の manifest フロー scripts/github-app*.mjs）のテスト。偽の GitHub（conversions）・偽のブラウザ（callback を叩く）・偽の pnpm / openssl / open を使い、本物の GitHub・Cloudflare・wrangler には触れない。manifest の中身、state の照合、secret が標準入力で渡り値が出ないこと、時間切れ・不一致・失敗で何も書かないことを確かめる"
run = "node --test scripts/github-app.test.mjs"

[tasks."test:byok"]
description = "byok（AI Gateway のプロバイダーキーの登録 scripts/byok.mjs）のテスト。偽の Cloudflare API をローカルに立てる。body・認証ヘッダ・上書きの確認・403 の案内・値が出ないことを確かめる"
run = "node --test scripts/byok.test.mjs"

[tasks."test:deps-scripts"]
description = "依存関係のキャッシュ（D14）のコンテナ内スクリプト（apps/agent/src/deps-scripts.ts）のテスト。一時ディレクトリの中で本物の bash を動かし、node_modules の退避・復元・取り出しを確かめる。Docker も Cloudflare も使わない"
run = "node --test scripts/deps-scripts.test.mjs"

[tasks."test:pm-prepare"]
description = "pnpm / yarn の本体の用意スクリプト（apps/agent/container/pm-prepare.mjs。イメージのビルド時と clone のあとに呼ぶ）のテスト。偽の corepack と偽の npm を PATH に置き、一時ディレクトリの中だけで動かす。Docker もネットワークも使わない"
run = "node --test scripts/pm-prepare.test.mjs"

[tasks."test:unit"]
description = "Unit テスト（audit + models + gateway + agent + web + デプロイスクリプト + 設定の生成器 + setup + github-app + byok + 依存キャッシュのスクリプト + pnpm / yarn の本体の用意スクリプト）"
depends = ["test:unit:audit", "test:unit:models", "test:unit:gateway", "test:unit:agent", "test:unit:web", "test:deploy", "test:deploy:config", "test:setup", "test:github-app", "test:byok", "test:deps-scripts", "test:pm-prepare"]

[tasks."test:infra"]
description = "infra/ の Terraform のテスト（terraform test + mock_provider。Cloudflare の資格情報は要らず、アカウントにも触れない。provider の取得にネットワークが要る）"
run = ["terraform -chdir=infra init -backend=false -input=false", "terraform -chdir=infra test"]

[tasks."test:e2e:gateway"]
description = "gateway の E2E（wrangler dev で実 Worker と偽 GitHub を起動し、MCP SDK Client から通しで検証）"
dir = "apps/gateway"
run = "pnpm exec vitest run --config vitest.e2e.config.ts"

[tasks."test:e2e:gateway:nologs"]
description = "gateway の E2E（LOGS = R2 を外した構成。archive_skipped で fail-open になることを検証）。dev registry の取り違えを避けるため test:e2e:gateway の後に直列で走らせる"
dir = "apps/gateway"
run = "pnpm exec vitest run --config vitest.e2e-nologs.config.ts"
wait_for = ["test:e2e:gateway"]

[tasks."test:e2e:gateway:userids"]
description = "gateway の E2E（ALLOWED_USER_IDS だけの認可の構成。ALLOWED_ORG / ALLOWED_TEAM は空）。dev registry の取り違えを避けるため test:e2e:gateway と test:e2e:gateway:nologs の後に直列で走らせる"
dir = "apps/gateway"
run = "pnpm exec vitest run --config vitest.e2e-userids.config.ts"
wait_for = ["test:e2e:gateway", "test:e2e:gateway:nologs"]

[tasks."test:e2e:docker"]
description = "agent の E2E（Docker 必須）。wrangler dev で実コンテナを起動し、偽サーバーで外向き通信の許可・拒否と Gateway→Agent の DO RPC を検証"
dir = "apps/agent"
run = "pnpm exec vitest run --config vitest.e2e.config.ts"
# 負荷によるタイムアウトを避けるため、Unit などの他のテストと同時には走らせない
wait_for = ["test:unit:gateway", "test:unit:agent", "test:unit:web", "test:fake-github", "test:e2e:gateway", "test:e2e:gateway:nologs", "test:e2e:gateway:userids"]

[tasks."test:e2e:full"]
description = "Gateway(MCP) → AgentDO → SandboxDO（実コンテナ）と、Web Research Service（apps/web。3つの Worker を同時に起動し、偽の Web / Clef / Web Search API を使う）の通しの E2E（Docker 必須）。Phase 3 のゴール（Draft PR・push・PR 本文の更新・トークンの失効）、Phase 4 の対話、Phase 5 の web_search / web_fetch の検証。test:e2e:docker と Docker コンテナの片付けが干渉しないよう、同時には走らせない"
dir = "apps/gateway"
run = "pnpm exec vitest run --config vitest.e2e-full.config.ts"
wait_for = ["test:e2e:docker"]

[tasks."test:e2e"]
description = "E2E（gateway + agent + 通し。agent と通しは Docker 必須）"
depends = ["test:e2e:gateway", "test:e2e:gateway:nologs", "test:e2e:gateway:userids", "test:e2e:docker", "test:e2e:full"]

[tasks."test:e2e:net"]
description = "agent の E2E の実ネットワーク版（Docker 必須。実 npm への GET・許可外ホストの拒否・github.com への認証なし clone が 401 で落ちること。CI の test には含めない）"
dir = "apps/agent"
run = "pnpm exec vitest run --config vitest.e2e-net.config.ts"

[tasks.test]
description = "Unit + infra + 偽 GitHub + E2E（Docker 必須。実ネットワーク版 test:e2e:net は含まない）"
depends = ["test:unit", "test:infra", "test:fake-github", "test:e2e"]

[tasks."typecheck:audit"]
description = "packages/audit の型検査"
dir = "packages/audit"
run = "pnpm exec tsc -p tsconfig.json"

[tasks."typecheck:models"]
description = "packages/models の型検査"
dir = "packages/models"
run = "pnpm exec tsc -p tsconfig.json"

[tasks."typecheck:gateway"]
description = "gateway の型検査"
dir = "apps/gateway"
run = "pnpm exec tsc -p tsconfig.json && pnpm exec tsc -p test/e2e/tsconfig.json && pnpm exec tsc -p test/full/tsconfig.json && pnpm exec tsc -p test/fake-github/tsconfig.json"

[tasks."typecheck:agent"]
description = "agent の型検査"
dir = "apps/agent"
run = "pnpm exec tsc -p tsconfig.json && pnpm exec tsc -p test/e2e/tsconfig.json"

[tasks."typecheck:web"]
description = "web の型検査"
dir = "apps/web"
run = "pnpm exec tsc -p tsconfig.json"

[tasks.typecheck]
description = "TypeScript の型検査（全アプリ）"
depends = ["typecheck:audit", "typecheck:models", "typecheck:gateway", "typecheck:agent", "typecheck:web"]

[tasks."lint:biome"]
description = "Biome による lint / format チェック"
run = "pnpm exec biome check ."

[tasks."lint:infra"]
description = "infra/ の整形の確認（terraform fmt -check）。init も資格情報も要らない"
run = "terraform fmt -check -recursive infra"

[tasks.lint]
description = "lint + 型検査 + 文書の点検（docs:check は node のスクリプトだけで 1 秒未満）+ Terraform の整形"
depends = ["lint:biome", "lint:infra", "typecheck", "docs:check"]

[tasks.fmt]
description = "Biome で整形"
run = "pnpm exec biome check --write ."

[tasks."infra:fmt"]
description = "infra/ の Terraform を整形する"
run = "terraform fmt -recursive infra"

[tasks."infra:validate"]
description = "infra/ の Terraform の構文と型の検証（init -backend=false のあと validate。資格情報は要らない）"
run = ["terraform -chdir=infra init -backend=false -input=false", "terraform -chdir=infra validate"]

[tasks."build:gateway"]
description = "gateway をバンドル（デプロイはしない）"
dir = "apps/gateway"
run = "pnpm exec wrangler deploy --dry-run --outdir dist"

[tasks."build:agent"]
description = "agent をバンドル（デプロイはしない。Docker イメージのビルドは --containers-rollout=none で省く）"
dir = "apps/agent"
run = "pnpm exec wrangler deploy --dry-run --containers-rollout=none --outdir dist"

[tasks."build:web"]
description = "web をバンドル（デプロイはしない）"
dir = "apps/web"
run = "pnpm exec wrangler deploy --dry-run --outdir dist"

[tasks.build]
description = "3 つの Worker をバンドル（デプロイはしない。バンドルが通るかの確認）"
depends = ["build:gateway", "build:agent", "build:web"]

[tasks.dev]
description = "wrangler dev でローカル起動（apps/gateway/.dev.vars を読む。.dev.vars.example 参照）。gateway 単体"
dir = "apps/gateway"
run = "pnpm exec wrangler dev"

[tasks."dev:all"]
description = "gateway・agent・web を同時にローカル起動（Docker 必須）。script_name 付きバインディングと service binding（WEB）は全部を同時に起動しないと解決できない"
run = "node apps/gateway/node_modules/wrangler/bin/wrangler.js dev -c apps/gateway/wrangler.jsonc -c apps/agent/wrangler.jsonc -c apps/web/wrangler.jsonc"

[tasks."test:fake-github"]
description = "偽 GitHub サーバーと GitHub クライアントの結合テスト（Node）"
dir = "apps/gateway"
run = "pnpm exec vitest run --config vitest.fake-github.config.ts"

[tasks.licenses]
description = "依存パッケージのライセンス一覧（全 workspace。dev 依存を含む。本番に入るものだけなら `pnpm -r licenses list --prod`）。公開前の点検用で、test / lint には含めない"
run = "pnpm -r licenses list"

[tasks."docs:check"]
description = "文書の機械的な点検（acceptance.md の節番号の連続、15 項目の対応表、全 Phase の結果表、区分表の網羅）。先に点検スクリプトの Unit（node:test）を流す"
run = "node --test scripts/docs-check.test.mjs && node scripts/docs-check.mjs"

[tasks."scan:secrets:selftest"]
description = "scan:secrets の自己確認（ダミーの秘密を入れた一時リポジトリで、検出・許可と、Claude-Session の上限 0 の動作を確かめる）。test / lint には含めない"
run = "bash scripts/test-scan-secrets.sh"

[tasks."scan:secrets"]
description = "公開前の点検: HEAD と全履歴の秘密・個人の値を gitleaks と自前の正規表現で調べる。Claude-Session は上限 0（1 本でもあれば失敗）。test / lint には含めない"
run = "bash scripts/scan-secrets.sh"

[tasks."release:check"]
description = "公開前の点検一式（scan:secrets の自己確認、scan:secrets、pnpm audit）。test / lint には含めない"
run = [
  "bash scripts/test-scan-secrets.sh",
  "bash scripts/scan-secrets.sh",
  "pnpm audit",
]

# ---- デプロイ（docs/deploy.md の quickstart） ----
# 初回は `mise run setup` 1 本（前提の確認 → terraform → deploy:config → deploy:all → deploy:secrets → GitHub App と BYOK の案内）。
# 下流の設定は rovo.config.json（秘密でない値だけ）。deploy:config が deploy.example/ の雛形と terraform の出力から deploy/ を生成する（コミットする）。
# deploy:* は ROVO_DEPLOY_DIR（wrangler 設定のディレクトリ）を使う。未設定、または設定ファイル（<dir>/{gateway,agent,web}.wrangler.jsonc）が無ければ、何もせずに失敗する。
# upstream の apps/*/wrangler.jsonc（本番の値が無い）は決して渡さない。

[tasks.setup]
description = "初回のデプロイを 1 本で行う（前提の確認 → terraform init/apply → deploy:config → deploy:all → deploy:secrets → GitHub App の自動作成〔ブラウザで Create GitHub App を押す〕→ BYOK の案内）。何度でも再実行できる。使い方: mise run setup -- [--yes] [--no-github-app] [--pem <既存の GitHub App の .pem>]"
run = "bash scripts/setup.sh"

[tasks."github-app"]
description = "GitHub App を manifest フロー（公式）で作る。ブラウザで手元のページが開き、GitHub で「Create GitHub App」を押すと、id / clientId を rovo.config.json に書き、client secret と秘密鍵は標準入力で gateway の secret に入れ（ディスクに書かない）、gateway を再デプロイして Install のページを開く。時間切れ・state の不一致・失敗は何も書かずに止まる。設定済みなら何もしない。使い方: mise run github-app -- [--recreate] [--org <名前> | --personal] [--name <App 名>] [--no-deploy]"
run = "node scripts/github-app.mjs"

[tasks.byok]
description = "AI Gateway にプロバイダーのキー（BYOK、alias は default）を登録する。キーは表示されない入力で受け取り、引数・env・ログ・ファイルに出さない。既に default があれば上書きの確認をする。env の CLOUDFLARE_API_TOKEN（Terraform 用。AI Gateway の Edit）が要る。使い方: mise run byok -- <anthropic|openai> [--yes]"
run = "node scripts/byok.mjs"

[tasks."deploy:config"]
description = "rovo.config.json（秘密でない値）と terraform の非秘密の出力（kv_namespace_id / archive_bucket_name / ai_gateway_id）から、deploy/ の wrangler 設定を生成する（生成物はコミットする）。terraform の資格情報が要る。オプション: --no-terraform（保存済みの deploy/infra.json から作り直す）/ --check（作り直した結果と既存を比べる。terraform 不要。下流の CI 用）"
run = "node scripts/deploy-config.mjs generate"

[tasks."deploy:config:check"]
description = "deploy:config --check の別名。terraform も Cloudflare の資格情報も要らず、deploy/ の生成物が rovo.config.json と deploy.example/ から作り直した結果と一致するかを確かめる（下流の CI 用）"
run = "node scripts/deploy-config.mjs generate --check"

[tasks."deploy:web"]
description = "web をデプロイする（ROVO_DEPLOY_DIR/web.wrangler.jsonc。未設定なら失敗する）"
run = "bash scripts/deploy.sh web"

[tasks."deploy:agent"]
description = "agent をデプロイする（ROVO_DEPLOY_DIR/agent.wrangler.jsonc。Docker が要る。未設定なら失敗する）"
run = "bash scripts/deploy.sh agent"

[tasks."deploy:gateway"]
description = "gateway をデプロイする（ROVO_DEPLOY_DIR/gateway.wrangler.jsonc。未設定なら失敗する）"
run = "bash scripts/deploy.sh gateway"

[tasks."deploy:all"]
description = "web → agent → gateway の順にデプロイする（設定が 1 つでも欠けていたら何もしない）"
run = "bash scripts/deploy.sh all"

[tasks."deploy:secrets"]
description = "入っていない secret だけを wrangler secret put で入れる。人が入力するのは GITHUB_APP_CLIENT_SECRET（隠した入力）だけ。GITHUB_APP_PRIVATE_KEY は --pem の .pem を PKCS#8 に変換、CLOUDFLARE_API_TOKEN は terraform output -raw、TOKEN_ENC_KEY は gateway と agent で別々に自動生成。既存の secret は上書きしない（入れ直すなら --rotate <名前>）。値は引数・env・ログに載せない。使い方: mise run deploy:secrets -- [--pem <path>] [--skip-github-app] [--rotate <名前>]"
run = "bash scripts/deploy.sh secrets"
